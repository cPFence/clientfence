services:
  db:
    image: mariadb:lts
    environment:
      MARIADB_DATABASE: ${CLIENTFENCE_DB_NAME:-clientfence}
      MARIADB_ROOT_PASSWORD: ${CLIENTFENCE_DB_PASS:-root}
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --host=127.0.0.1 --user=root --password=\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  app:
    image: ${CLIENTFENCE_TEST_IMAGE:?CLIENTFENCE_TEST_IMAGE is required}
    environment:
      APP_ENV: test
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases:
          - clientfence-app
