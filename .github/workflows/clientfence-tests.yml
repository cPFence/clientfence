# ClientFence tests.
# Builds the Dockerfile `test` target on each supported PHP version (8.3 to 8.5) and runs Pest
# on each; PHPStan runs once (phpstan.neon checks the code against the whole 8.3-8.5 range). The
# build cache stays in GitHub Actions' cache, so no images are pushed to a registry.
# Not on pushes: a run takes about 27 Actions minutes and the same tests run
# locally before every commit and release. Start it by hand (Run workflow) or from a pull request.
name: ClientFence tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clientfence-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Pest (PHP ${{ matrix.php }})'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: 'Build Docker Test Image'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          cache-from: type=gha,scope=clientfence-test-${{ matrix.php }}
          cache-to: type=gha,scope=clientfence-test-${{ matrix.php }},mode=max
          context: .
          load: true
          tags: clientfence:test
          target: test

      - name: 'PHPStan'
        if: matrix.php == '8.5'
        run: |
          docker run --rm --env APP_ENV=test clientfence:test \
            ./src/vendor/bin/phpstan analyse --configuration phpstan.neon --memory-limit=1G --no-progress

      - name: 'Pest'
        run: |
          docker run --rm --env APP_ENV=test clientfence:test \
            ./src/vendor/bin/pest --test-directory ../tests --configuration phpunit.xml.dist --ci

  install:
    # The release build installed with its own installer on a clean MariaDB,
    # then staff sign-in, a product, a client order paid with the manual gateway and a ticket
    # (tools/install-test.sh). "upgrade" installs the release on the clientfence.com feed first
    # and updates it to this build, as System → Update does.
    name: 'Install test (${{ matrix.mode }})'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: ['install', 'upgrade']
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: 'Install test'
        run: |
          if [ "${{ matrix.mode }}" = upgrade ]; then
            bash tools/install-test.sh --from latest
          else
            bash tools/install-test.sh
          fi
